<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="head">
      <span id="dot" class="dot" title="连接状态"></span>
      <span class="head__title">Atlas</span>
      <span id="model" class="head__model"></span>
      <span class="spacer"></span>
      <button id="newSession" class="mini" type="button">新会话</button>
      <button id="openOptions" class="mini" type="button" title="连接设置">设置</button>
    </header>
    <div id="pageChip" class="page-chip" hidden>
      <span id="pageChipTitle" class="page-chip__title"></span>
      <button id="pageChipRemove" class="mini" type="button">移除</button>
    </div>
    <main id="messages" class="messages"></main>
    <div id="approvals" class="approvals"></div>
    <footer class="composer">
      <div class="composer__actions">
        <button id="askPage" class="mini" type="button">问本页</button>
        <span id="notice" class="notice"></span>
      </div>
      <div class="composer__row">
        <textarea id="input" rows="3" placeholder="问 Atlas…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send" class="send" type="button">发送</button>
      </div>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
